# docker compose up --build        synthetic Accra storm
# S2R_SOURCE=openmrg docker compose up   real Gothenburg data (downloads ~28 MB once)
#
# The pipeline runs once and exits; the backend starts after it succeeds.
# Code folders are mounted, so edits reload without rebuilding.

services:
  pipeline:
    build: ./pipeline
    command: python -m s2r.run --source ${S2R_SOURCE:-synthetic}
    volumes:
      - ./pipeline:/app
      - ./data:/data

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATA_DIR: /data/processed
      # File events from Windows/macOS hosts don't always reach containers
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
      - ./data:/data
    ports:
      - "8000:8000"
    depends_on:
      pipeline:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "1"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
